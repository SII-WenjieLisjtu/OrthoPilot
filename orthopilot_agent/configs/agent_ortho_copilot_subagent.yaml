defaults:
 - benchmark: example_dataset
 - override hydra/job_logging: none
 - _self_

main_agent:
 prompt_class: MainAgentPromptBoxedAnswer
 llm:
 provider_class: "GPTOpenAIClient"
 model_name: "qwen3.6-plus"
 async_client: true
 temperature: 0.3
 top_p: 0.95
 min_p: 0.0
 top_k: -1
 max_tokens: 8192
 openai_api_key: "${oc.env:OPENAI_API_KEY,EMPTY}"
 openai_base_url: "${oc.env:OPENAI_BASE_URL,http://localhost:8000}"
 keep_tool_result: -1
 oai_tool_thinking: false

 tool_config:
 # - tool-reasoning-os
 # - tool-reading
 - tool-image-video

 max_turns: 50
 max_tool_calls_per_turn: 10
 input_process:
 hint_generation: false
 output_process:
 final_answer_extraction: false
 openai_api_key: "${oc.env:OPENAI_API_KEY,EMPTY}"
 add_message_id: true
 keep_tool_result: -1
 chinese_con: "true"

sub_agents:
 agent-worker:
 prompt_class: SubAgentWorkerPrompt
 llm:
 provider_class: "GPTOpenAIClient"
 model_name: "qwen3.6-plus"
 async_client: true
 temperature: 0.3
 top_p: 0.95
 min_p: 0.0
 top_k: -1
 max_tokens: 8192
 openai_api_key: "${oc.env:OPENAI_API_KEY,EMPTY}"
 openai_base_url: "${oc.env:OPENAI_BASE_URL,http://localhost:8000}"
 keep_tool_result: -1
 oai_tool_thinking: false

 tool_config:
 # Local clinical evidence tools
 - tool-ehr
 - tool-similar-case
 # External knowledge tools
 - tool-knowledge-graph
 - tool-medrag
 - tool-web-search

 max_turns: 10
 max_tool_calls_per_turn: 10

output_dir: logs/
data_dir: "${oc.env:DATA_DIR,data}"
