### model
model_name_or_path: checkpoints/model
trust_remote_code: true

### method
stage: pt
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all

### dataset
dataset: AGCT, Apollo, BioLeaflets, biology_book, biology_wiki, biorxiv-clustering-s2s, ChatMed-Consult-Dataset, Clinical_Guidelines, dataunknow, gliner-bird-diet-synthetic, med_qa, Medical_Cord19, medicine_wiki, medqa_corpus_en, ReMeDi, ShenNong-TCM-Dataset
cutoff_len: 4096
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: checkpoints/pt/Qwen3-14B-pt
logging_steps: 10
save_steps: 2000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
# eval_dataset: c4_demo
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
