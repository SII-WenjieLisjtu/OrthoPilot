name: "tool-image-video"
tool_command: "python"
args:
 - "-m"
 - "tool_plaza.mcp_servers.vision_mcp_server"
env:
 # Visual question answering provider selection order:
 # 1. If ANTHROPIC_API_KEY is set, Anthropic is used.
 # 2. If OPENAI_API_KEY is set and Anthropic is not configured, OpenAI is used.
 # 3. If neither is set, Gemini is used and GEMINI_API_KEY is required.
 # 4. Gemini credentials are required for YouTube video analysis.
 ANTHROPIC_API_KEY: "${oc.env:ANTHROPIC_API_KEY,EMPTY}"
 ANTHROPIC_BASE_URL: "${oc.env:ANTHROPIC_BASE_URL,https://api.anthropic.com}"
 ANTHROPIC_MODEL_NAME: "${oc.env:ANTHROPIC_MODEL_NAME,claude-3-7-sonnet-20250219}"
 OPENAI_API_KEY: "${oc.env:OPENAI_API_KEY,EMPTY}"
 OPENAI_BASE_URL: "${oc.env:OPENAI_BASE_URL,https://api.openai.com/v1}"
 OPENAI_MODEL_NAME: "${oc.env:OPENAI_MODEL_NAME,gpt-4o}"
 GEMINI_API_KEY: "${oc.env:GEMINI_API_KEY,EMPTY}"
